name: Build course site

on:
  push:
    branches: [main]
    paths:
      - 'mbsr-course/**'
      - 'site/**'
      - '.github/workflows/build-site.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Keep only referenced assets
        working-directory: site
        run: |
          cd dist
          grep -rhoP '/assets/[^"<]+' --include='*.html' . | sed 's#^/assets/##' | sort -u > /tmp/refs.txt
          mkdir -p /tmp/assets
          while IFS= read -r f; do
            if [ -f "assets/$f" ]; then cp "assets/$f" /tmp/assets/; fi
          done < /tmp/refs.txt
          rm -rf assets
          mv /tmp/assets assets
          ls assets
      - name: Deploy dist to site-dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/dist
          publish_branch: site-dist
          force_orphan: true
          full_commit_message: 'Build course site from ${{ github.sha }}'
